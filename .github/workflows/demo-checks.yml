name: Demo checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate notebook JSON
        run: python -c "import json, pathlib; json.loads(pathlib.Path('notebooks/iberoamerica_books_demo.ipynb').read_text(encoding='utf-8'))"
